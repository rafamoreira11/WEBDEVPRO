<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar</title>

    <style>

        body{
            font-family: Arial, Helvetica, sans-serif;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background-color: #1a1a1a;
            color: white;
        }

        .nav-conteiner{
            margin-bottom: 40px;
        }

        h2{
            margin-bottom: 10px;
        }

        .nav1{
            padding: 10px;
            background-color: #eaeaea;
        }

        .nav1 ul {
            margin: 0;
            padding: 0;
            list-style-type: none;
            display: flex;
            align-items: center;
            justify-content: space-around;
        }

        .nav1 li{
            display: inline;
        }

        .nav1 a {
            padding: 5px 15px;
            text-decoration: none;
            color: #202020;
        }

        .nav1 .login-btn{
            border: none;
            border-radius: 5px;
            background-color: #254bf6;
            padding: 5px 15px;
            color: #fff;
            cursor: pointer;
        }

    </style>
</head>
<body>
    <div class="nav-conteiner">
        <h2>Variation 1: Horizontal with underline effect</h2>
        <nav class="nav1">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
                <li><button class="login-btn">Login</button></li>
            </ul>
        </nav>
    </div>
    <div class="nav-conteiner">
        <h2>Variation 2: Vertical with hover effect</h2>
        <nav class="nav2">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Products</a></li>
            </ul>
            <button>Login</button>
        </nav>
    </div>
    <div class="nav-conteiner">
        <h2>Variation 3: Horizontal with dropdown</h2>
        <nav class="nav3">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About<br> Our Story Team Contact</a></li>
                <li><a href="#">Products</a></li>
                <li><button>Login</button></li>
            </ul>
        </nav>
    </div>
</body>
</html>
